openapi: 3.1.0
info:
  title: Scyne Orchestrator
  version: 0.1.0
  description: |
    Local orchestration for Claude Code agents. Workflows are declared as data;
    the engine executes them deterministically, one wake at a time, parking at
    anything that waits on something external (a human approval gate, or a
    spawned child flow). No authentication — the service binds to loopback
    only and is meant to run alongside the process that embeds it.
servers:
  - url: http://127.0.0.1:3100
    description: Default local bind (see `serve --port`)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency check
      description: >-
        Confirms the process is up and can reach its database. `claude`
        reports the Claude Code CLI version found on PATH, or `"unknown"` if
        it could not be resolved — this endpoint never fails the request just
        because that lookup did.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, db, claude]
                properties:
                  ok:     { type: boolean }
                  db:     { type: string, example: "pglite / PostgreSQL 16.4" }
                  claude: { type: string, example: "2.1.232" }
              example:
                ok: true
                db: "pglite / PostgreSQL 16.4"
                claude: "2.1.232"

  /agents:
    get:
      operationId: listAgents
      summary: List every agent in the org chart
      description: >-
        Returns every agent upserted from `config.org` on the last startup —
        the config file is the source of truth, and this reflects the
        database's mirror of it.
      responses:
        "200":
          description: Agents, oldest hired first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
              example:
                - key: "ba"
                  name: "BA"
                  adapter: "claude_local"
                  status: "idle"

    post:
      operationId: hireAgent
      summary: Add an agent to the org
      description: >-
        Writes the agent to the database AND to `.orchestrator/overrides.json`.
        Both are required: the org reconciles from the consumer's config file on
        every boot, so an agent that existed only in the database would vanish on
        the next restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:           { type: string, description: "Address of the agent. Letters, digits, - and _." }
                name:          { type: string }
                title:         { type: string }
                icon:          { type: string }
                reportsTo:     { type: [string, "null"], description: "Another agent's key" }
                adapter:       { type: string }
                model:         { type: string }
                effort:        { type: string, enum: [low, medium, high, xhigh, max] }
                fallbackModel: { type: array, items: { type: string } }
                mcpEnabled:    { type: boolean }
                bundlePath:    { type: string }
                budget:        { $ref: "#/components/schemas/Budget" }
            example:
              key: "securityReviewer"
              name: "Security Reviewer"
              reportsTo: "archLead"
              model: "claude-sonnet-4-6"
      responses:
        "201":
          description: The hired agent
        "400":
          description: Key already taken, malformed key, or an unregistered adapter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{key}:
    get:
      operationId: getAgent
      summary: Fetch one agent by its config key
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: patchAgent
      summary: Adjust an agent's runtime (adapter, model, effort, fallback models, budget)
      description: >-
        A narrow patch, not a full replace — every field is optional, and any
        field left out keeps its current value. Reconstructs the full agent
        spec under the hood and round-trips it through the same
        `upsertAgent` the config-file reconciliation on startup uses, so a
        PATCH and a config-file edit converge on the same row shape.
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                adapter:       { type: string, description: "Key into the registered adapters (see GET /runners)." }
                model:         { type: string }
                effort:        { type: string, enum: [low, medium, high, xhigh, max] }
                fallbackModel: { type: array, items: { type: string }, description: "Tried in order when the primary is overloaded." }
                bundlePath:
                  type: [string, "null"]
                  description: >-
                    Workspace-relative path to the agent's system prompt. Required
                    before `PUT /agents/{key}/bundle` will write anything; `null`
                    clears it and the agent falls back to the bare workflow prompt.
                budget:
                  type: object
                  properties:
                    maxTokens:     { type: number }
                    maxCostUsd:    { type: number }
                    maxDurationMs: { type: number }
            example:
              model: "claude-opus-4-6"
              effort: "high"
              budget: { maxCostUsd: 5 }
      responses:
        "200":
          description: The updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400":
          description: An invalid `effort` was supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      operationId: disableAgent
      summary: Disable an agent
      description: >-
        Sets the agent's status to `disabled` and records the removal in the
        overlay. The row is kept, not destroyed: runs and issues reference
        agents, and an agent that has done work is part of the audit trail that
        explains a spend figure. Refused while the agent still owns an open
        issue.
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      responses:
        "200":
          description: The agent is disabled
        "400":
          description: The agent still owns open issues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{key}/runs:
    get:
      operationId: listAgentRuns
      summary: Every run this agent has been assigned, most recent first
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{key}/bundle:
    get:
      operationId: getAgentBundle
      summary: The agent's system-prompt bundle, read from disk
      description: >-
        Returns the file named by the agent's `bundlePath`, read fresh on every
        request. An agent that declares no bundle returns `path: null` and empty
        content; an agent whose declared file cannot be read returns the path,
        empty content and an `error` — that state is a finding, not a 404, since
        it is what makes the runtime fail on the next run.
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      responses:
        "200":
          description: The bundle path and its contents
          content:
            application/json:
              schema:
                type: object
                required: [path, content]
                properties:
                  path:    { type: [string, "null"] }
                  content: { type: string }
                  error:   { type: string }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: putAgentBundle
      summary: Overwrite the agent's system-prompt bundle
      description: >-
        Writes `content` to the file named by the agent's `bundlePath`. The
        runner reads that file at SPAWN time, so a save applies to the very next
        run — nothing to re-register, nothing to restart, and a run already in
        flight is unaffected because it was handed its prompt when it started.
        Written via a temp file and a rename, so an interrupted write leaves the
        previous instructions intact. A declared-but-missing file is created,
        which is how the "System prompt file not found" state is repaired from
        the console. Refuses an agent with no `bundlePath`, and any path that
        resolves outside the workspace.
      parameters:
        - $ref: "#/components/parameters/AgentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The complete new file contents. Replaces, never appends.
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path:  { type: string }
                  bytes: { type: integer }
        "400":
          description: No bundlePath declared, content is not a string, or the path escapes the workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No agent has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /skills:
    get:
      operationId: listSkills
      summary: Every skill the workflows invoke, cross-referenced against disk
      description: >-
        The agent-to-skill mapping is DERIVED by walking `config.workflows` —
        each `agent` step may name a `skill`, and the agent running it is
        `step.agent` falling back to the workflow's `assignee`, the same
        resolution the engine performs — so it cannot drift from what actually
        runs. Merged with whatever is in `config.skillsDir`. `status` is the
        point: `missing` means a workflow invokes a skill with no `SKILL.md`, so
        every run of that stage will die with `Unknown skill` after spawning;
        `unused` means a file nothing invokes. Problems sort first.
      responses:
        "200":
          description: The skill inventory
          content:
            application/json:
              schema:
                type: object
                required: [dir, skills]
                properties:
                  dir:
                    type: [string, "null"]
                    description: The configured `skillsDir`, or null when unset.
                  skills:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }

  /skills/{name}:
    get:
      operationId: getSkill
      summary: One skill's SKILL.md, with its derived usage
      description: >-
        A referenced-but-absent file returns the row, empty content and an
        `error` rather than a 404 — that state is the finding, and it is what
        the editor offers to repair.
      parameters:
        - $ref: "#/components/parameters/SkillName"
      responses:
        "200":
          description: The skill, its usage and its contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Skill"
                  - type: object
                    properties:
                      content: { type: string }
                      error:   { type: string }
        "400":
          description: The name resolves outside the skills directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No workflow invokes this name and no such directory exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: putSkill
      summary: Overwrite a skill
      description: >-
        Temp file plus rename, so an interrupted write leaves the previous skill
        intact — but resolved through `realpath` first: a skills directory is
        often a directory of SYMLINKS into the source tree, and renaming onto a
        symlink replaces the link with a regular file, quietly severing it from
        the file the team maintains. Skills are read by the runtime when the
        agent invokes them, so a save applies to the next run.
      parameters:
        - $ref: "#/components/parameters/SkillName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                required: [name, path, bytes]
                properties:
                  name:  { type: string }
                  path:  { type: string }
                  bytes: { type: integer }
        "400":
          description: No skillsDir configured, content is not a string, or the name escapes the directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runners:
    get:
      operationId: listRunners
      summary: Registered adapter keys
      description: >-
        The keys of `config.adapters` — what an agent step or `PATCH
        /agents/{key}` may name as `adapter`. Not the adapters themselves
        (they hold live runner instances, not serialisable data).
      responses:
        "200":
          description: Adapter keys
          content:
            application/json:
              schema: { type: array, items: { type: string } }
              example: ["claude_local"]

  /issues:
    post:
      operationId: createIssue
      summary: Start a workflow
      description: >-
        Creates the top-level issue for `workflow` and immediately calls
        `engine.advance()` on it in the background (fire-and-forget — the
        response does not wait for the first step to finish). Poll `GET
        /issues/{id}` for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow: { type: string, description: "A key from config.workflows." }
                params:   { type: object, additionalProperties: true, description: "e.g. { project, feature }" }
            example:
              workflow: "requirements"
              params: { project: "RTWSA", feature: "Appeals & Reviews" }
      responses:
        "201":
          description: The created issue (workflow's first steps may already have run by the time this returns)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400":
          description: Missing `workflow`, or the named workflow does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listIssues
      summary: List issues, optionally filtered
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [todo, in_progress, in_review, blocked, done, cancelled] }
          description: Exact status match
        - name: parentId
          in: query
          required: false
          schema: { type: string }
          description: >-
            An issue uuid to list only that issue's children, or the literal
            string `"null"` to list only top-level issues.
        - name: assigneeAgentId
          in: query
          required: false
          schema: { type: string }
          description: An agent uuid, or the literal string `"null"` for unassigned issues.
      responses:
        "200":
          description: Issues, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }

  /issues/{id}:
    get:
      operationId: getIssue
      summary: Fetch one issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404":
          description: No issue has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: patchIssue
      summary: Update issue fields directly
      description: >-
        A low-level escape hatch (title, description, status, assignee,
        workflow key, step index, params) — most callers should drive issue
        state through `POST /issues`, `POST /gates/{id}/approve` and `POST
        /gates/{id}/reject` instead, which also advance the engine.
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:           { type: string }
                description:     { type: [string, "null"] }
                status:          { type: string, enum: [todo, in_progress, in_review, blocked, done, cancelled] }
                assigneeAgentId: { type: [string, "null"] }
                workflowKey:     { type: [string, "null"] }
                stepIndex:       { type: integer }
                params:          { type: object, additionalProperties: true }
            example:
              status: "blocked"
      responses:
        "200":
          description: The updated issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404":
          description: No issue has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      operationId: deleteIssue
      summary: Delete an issue and its whole subtree
      description: >-
        Cascades to comments, work products, gates, runs and child issues.
        Refused while a run is in flight — the child process would keep writing
        to a log whose run row no longer exists, and its cost would disappear
        from the spend figures.
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Deleted
        "400":
          description: A run is still in flight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No issue has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /issues/{id}/advance:
    post:
      operationId: advanceIssue
      summary: Resume a parked or blocked issue from its current step
      description: >-
        Clears a `blocked` status and advances the workflow from wherever it
        stopped. Returns immediately — the run continues in the background, so
        poll `GET /issues/{id}` for progress. This is also what a rejected gate
        does automatically; the endpoint exists for the cases a human drives:
        retrying a step that blocked on a missing file, or nudging an issue
        after fixing the thing that stopped it.
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "202":
          description: Accepted — the engine is advancing the issue in the background
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  issueId: { type: string }
        "400":
          description: The issue is already done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No issue has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /issues/{id}/pause:
    post:
      operationId: pauseIssue
      summary: "Pause a running issue. `{force: true}` kills the agent now; otherwise the step in flight finishes first."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The request was recorded. Poll GET /issues/{id} — a graceful pause takes effect at the next step boundary.
        "400": { description: The issue is already done or cancelled }
        "401": { description: Authentication required }
        "404": { description: No such issue in this organisation }
  /issues/{id}/cancel:
    post:
      operationId: cancelIssue
      summary: Stop an issue for good, killing any agent in flight. It does not resume.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The request was recorded
        "400": { description: The issue is already done }
        "401": { description: Authentication required }
        "404": { description: No such issue in this organisation }
  /issues/{id}/resume:
    post:
      operationId: resumeIssue
      summary: Carry a paused issue on from where it stopped. Steps that already succeeded are not re-run.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Resuming in the background
        "400": { description: The issue is already done }
        "401": { description: Authentication required }
        "404": { description: No such issue in this organisation }
        "409": { description: The issue was cancelled and does not resume }
  /issues/{id}/comments:
    get:
      operationId: listIssueComments
      summary: An issue's activity feed
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
    post:
      operationId: addIssueComment
      summary: Post a comment
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:           { type: string }
                authorAgentId:  { type: string, description: "Set when an agent is posting." }
                authorUser:     { type: string, description: "Set when a human is posting; defaults to \"api\"." }
            example:
              body: "Looks good, approving."
              authorUser: "tagari"
      responses:
        "201":
          description: The created comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          description: Missing `body`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /issues/{id}/work-products:
    get:
      operationId: listWorkProducts
      summary: Files and links attached to an issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Work products, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkProduct" }

  /issues/{id}/work-products/{wpId}/content:
    get:
      operationId: readWorkProduct
      summary: One work product's content, so a reviewer can read it before approving
      description: >
        Returns the file's text for a `local` work product. A work product's
        `url` is a `file://` path on the SERVER, which no HTTP client can open —
        this is how the CLI and the console show a reviewer the document they
        are being asked to approve. Content is capped at 512 KB; `truncated`
        says whether it was cut. A non-local product (a published wiki page)
        returns `content: null` with an `error` naming its URL instead.
      parameters:
        - $ref: "#/components/parameters/IssueId"
        - name: wpId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The work product's content, or an error explaining why there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkProductContent" }
        "404":
          description: No such issue, or no such work product on it

  /issues/{id}/gates:
    get:
      operationId: listIssueGates
      summary: An issue's approval gates
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Gates, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gate" }

  /gates/{id}/approve:
    post:
      operationId: approveGate
      summary: Approve a pending gate and resume the workflow
      description: >-
        Records the decision and advances the issue's step index past the gate,
        then resumes the workflow IN THE BACKGROUND and responds immediately.
        The next step is typically a `publish` phase, which runs an agent for
        minutes — a response that waited for it would time out on a click that
        actually worked. Poll `GET /issues/{id}` for what happens next.
      parameters:
        - $ref: "#/components/parameters/GateId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateDecisionInput" }
            example: { note: "Ship it.", by: "tagari" }
      responses:
        "202":
          description: Accepted — decision recorded, the workflow resumes in the background
          content:
            application/json:
              schema:
                type: object
                required: [ok, issueId]
                properties:
                  ok:      { type: boolean }
                  issueId: { type: string }
        "404":
          description: No gate has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /gates/{id}/reject:
    post:
      operationId: rejectGate
      summary: Reject a pending gate and regenerate from the generating step
      description: >-
        Rewinds the issue to the last `agent` step at or before the gate —
        rejection means "the generated output was wrong", so the natural resume
        point is the step that generated it rather than the gate. The
        regeneration then runs IN THE BACKGROUND and this responds immediately;
        a rejected artefact comes back to a fresh gate on its own. Poll
        `GET /issues/{id}`.
      parameters:
        - $ref: "#/components/parameters/GateId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateDecisionInput" }
            example: { note: "Wrong personas — regenerate.", by: "tagari" }
      responses:
        "202":
          description: Accepted — decision recorded, the regeneration runs in the background
          content:
            application/json:
              schema:
                type: object
                required: [ok, issueId]
                properties:
                  ok:      { type: boolean }
                  issueId: { type: string }
        "404":
          description: No gate has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /issues/{id}/runs:
    get:
      operationId: listIssueRuns
      summary: Every run this issue has spawned, most recent first
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }

  /runs/{id}:
    get:
      operationId: getRun
      summary: Fetch one run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: No run has this id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{id}/log:
    get:
      operationId: getRunLog
      summary: Raw run log, from an optional byte offset
      description: >-
        The unfiltered JSONL log written by the runner (`{ts, stream,
        chunk}` per line). Poll with `offset = nextOffset` from the previous
        response to fetch only what has been appended since.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/LogOffset"
      responses:
        "200":
          description: A slice of the raw log
          content:
            application/json:
              schema:
                type: object
                required: [content, nextOffset]
                properties:
                  content:    { type: string }
                  nextOffset: { type: integer }
        "404":
          description: No run has this id, or its log file no longer exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{id}/transcript:
    get:
      operationId: getRunTranscript
      summary: Filtered, client-safe transcript events, from an optional byte offset
      description: >-
        The same log as `GET /runs/{id}/log`, run through
        `filterRunLog()` — assistant text, tool calls/results, skill
        invocations and framing lines, with known secret patterns redacted.
        `nextOffset` is relative to the SAME raw byte stream as the `log`
        endpoint, so the two can be polled with the same cursor.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/LogOffset"
      responses:
        "200":
          description: A slice of the filtered transcript
          content:
            application/json:
              schema:
                type: object
                required: [events, nextOffset]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/TranscriptEvent" }
                  nextOffset: { type: integer }
              example:
                events:
                  - { ts: "14:32:01", kind: "assistant", text: "Reading the discovery documents…" }
                  - { ts: "14:32:04", kind: "tool_use", tool: "Read", preview: "requirements/SOP/policy.md" }
                nextOffset: 4096
        "404":
          description: No run has this id, or its log file no longer exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /budgets:
    get:
      operationId: listBudgets
      summary: Every budget limit set for this company
      responses:
        "200":
          description: Budgets across the agent, workflow and project scopes
    post:
      operationId: setBudget
      summary: Set or clear a budget limit
      description: >-
        `scope` is agent, workflow or project. The engine reads the WORKFLOW
        budget first and falls back to the agent's, so a limit set here applies
        to the next run with no restart. Omitting all three limits clears the
        budget instead of setting an empty one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, scopeKey]
              properties:
                scope:         { type: string, enum: [agent, workflow, project] }
                scopeKey:      { type: string, description: "Agent key, workflow key, or project name" }
                maxTokens:     { type: number }
                maxCostUsd:    { type: number }
                maxDurationMs: { type: number }
            example:
              scope: "agent"
              scopeKey: "dataModeler"
              maxCostUsd: 15
              maxDurationMs: 2700000
      responses:
        "200":
          description: The budget as stored, or a confirmation that it was cleared
        "400":
          description: Missing or invalid scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /usage:
    get:
      operationId: getUsage
      summary: Aggregate token and cost usage across every run for this company
      responses:
        "200":
          description: Usage totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              example:
                runCount: 42
                inputTokens: 1250000
                outputTokens: 98000
                cacheReadTokens: 300000
                cacheCreationTokens: 50000
                costUsd: 12.4351

  /workflows/{key}:
    get:
      operationId: getWorkflow
      summary: One workflow in full, including each agent step's prompt
      description: >-
        `GET /config` omits prompts — it is a summary and these run to kilobytes
        each. This is the only way to see what an agent is actually told: the
        prompt reaches the runtime on stdin rather than argv, and the transcript
        filter has no event kind for it, so after a run the instruction it
        received is otherwise unrecoverable. Read-only by design — these strings
        are compiled from the consumer's pipeline definition, and an override
        would make one workflow hand-maintained while a later pipeline change
        silently stopped reaching it. The layers meant to be edited are the
        agent's bundle (`PUT /agents/{key}/bundle`) and the skill
        (`PUT /skills/{name}`).
      parameters:
        - name: key
          in: path
          required: true
          description: The workflow key.
          schema: { type: string }
      responses:
        "200":
          description: The workflow and every step
          content:
            application/json:
              schema:
                type: object
                required: [key, label, assignee, params, steps]
                properties:
                  key:       { type: string }
                  label:     { type: string }
                  assignee:  { type: string }
                  title:     { type: [string, "null"] }
                  variantOf: { type: string }
                  variant:   { type: string }
                  params:    { type: array, items: { type: string } }
                  steps:
                    type: array
                    description: >-
                      Shaped per step type. `exec` carries cmd/cwd/timeoutMs;
                      `agent` carries phase, skill, the resolved agent, runtime
                      overrides, `reads` and `prompt`; `attach` carries files;
                      `gate` carries title and summary; `flow` carries the child
                      workflow and its params.
                    items:
                      type: object
                      required: [type]
                      properties:
                        type:      { type: string, enum: [exec, agent, attach, gate, flow] }
                        cmd:       { type: string }
                        cwd:       { type: string }
                        timeoutMs: { type: integer }
                        phase:     { type: string }
                        skill:     { type: string }
                        agent:     { type: string, description: "Resolved: the step's agent, else the workflow's assignee." }
                        adapter:   { type: string }
                        model:     { type: string }
                        effort:    { type: string, enum: [low, medium, high, xhigh, max] }
                        reads:
                          type: object
                          additionalProperties: { type: string }
                          description: "Variable name to workspace-relative path template."
                        prompt:
                          type: string
                          description: >-
                            The verbatim prompt template. Absent when the step
                            declares none — the engine then builds a default
                            from the phase and the issue's params.
                        files:     { type: array, items: { type: string } }
                        title:     { type: string }
                        summary:   { type: string }
                        workflow:  { type: string }
        "404":
          description: No workflow has this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /config:
    get:
      operationId: getConfig
      summary: A sanitised view of the loaded orchestrator config
      description: >-
        Workspace, company, registered adapter keys, defaults, the resolved
        theme, and a summary of each workflow — never the adapter instances
        themselves (they are runner objects, not serialisable data, and may
        carry credentials).
      responses:
        "200":
          description: Config summary
          content:
            application/json:
              schema:
                type: object
                required: [workspace, company, adapters, defaults, theme, workflows]
                properties:
                  workspace: { type: string }
                  company:   { type: string }
                  adapters:  { type: array, items: { type: string } }
                  defaults:
                    type: object
                    properties:
                      adapter: { type: string }
                      model:   { type: string }
                      effort:  { type: string, enum: [low, medium, high, xhigh, max] }
                  theme:     { $ref: "#/components/schemas/Theme" }
                  workflows:
                    type: array
                    items:
                      type: object
                      properties:
                        key:      { type: string }
                        label:    { type: string }
                        assignee: { type: string }
                        steps:    { type: integer }
                        variantOf:
                          type: string
                          description: >-
                            Another workflow's key, when this one is a MODE of that
                            workflow rather than a peer of it — a revision of the
                            artefact it produces, say. Purely presentational: the
                            engine runs a variant exactly like any other workflow,
                            and budgets are still keyed by this workflow's own key.
                            Declared by the consumer, never inferred from a naming
                            convention.
                        variant:
                          type: string
                          description: Short label for the mode, e.g. "revise".
                        params:
                          type: array
                          items: { type: string }
                          description: >-
                            The variable names this workflow's own step
                            templates interpolate, in first-appearance order —
                            derived by scanning the workflow, not declared
                            beside it, so it cannot drift. `workspace` and
                            `issueId` are excluded: the engine injects both on
                            every step. This is what `POST /issues` expects
                            under `params`.
                        stepList:
                          type: array
                          description: >-
                            Each step's type and (for agent steps) phase, in
                            order — enough to name the step an issue is parked
                            on. Prompts, shell commands and `reads` paths are
                            deliberately not included.
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum: [exec, agent, attach, gate, flow]
                              phase: { type: string }

  /orch:
    get:
      operationId: getConsole
      summary: The operator console — one self-contained HTML page
      description: >-
        Inline CSS and JS, zero network requests, themed from the consumer's
        `config.theme`. Tabs for runs (with live transcripts), issues, pending
        gates with approve/reject, the org chart, spend and config.
      responses:
        "200":
          description: The console
          content:
            text/html:
              schema: { type: string }

  /openapi.json:
    get:
      operationId: getOpenApiJson
      summary: This contract, as JSON
      description: The parsed `openapi.yaml`, served verbatim as JSON — what `GET /docs` itself renders from.
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/json:
              schema: { type: object }

  /docs:
    get:
      operationId: getDocs
      summary: Self-contained, themed API reference
      description: >-
        A hand-rolled HTML page rendered from `openapi.yaml` — no CDN-loaded
        Swagger UI or Redoc, no external stylesheets or fonts, zero network
        requests. Styled with the same CSS custom properties `themeCss()`
        exposes to any other page in this package, so an `orchestrator.config
        .ts` theme override repaints it without a code change.
      responses:
        "200":
          description: The rendered docs page
          content:
            text/html:
              schema: { type: string }


  # ---- platform: identity, projects, documents, access, audit ----
  /auth/bootstrap:
    post:
      operationId: bootstrapInstallation
      summary: Claim an installation that has no users yet, creating the first administrator. Refused once any user exists.
      responses:
        "201":
          description: OK
        "401": { description: Authentication required }
  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for a session token.
      responses:
        "200":
          description: OK
        "401": { description: Authentication required }
  /auth/logout:
    post:
      operationId: logout
