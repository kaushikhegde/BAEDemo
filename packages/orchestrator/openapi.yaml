      responses:
        "200": { description: OK }
        "401": { description: Authentication required }
    put:
      operationId: setSetting
      summary: Set adapter, model or effort for a project or for the whole company. Administrators only.
      responses:
        "200": { description: OK }
        "400": { description: Unknown key, scope, or unregistered adapter }
        "401": { description: Authentication required }
        "403": { description: Administrators only }
        "404": { description: No such project }
    delete:
      operationId: clearSetting
      summary: Remove a setting so the next broader scope applies. Administrators only.
      responses:
        "200": { description: OK }
        "401": { description: Authentication required }
        "403": { description: Administrators only }
        "404": { description: No such setting }

components:
  parameters:
    SkillName:
      name: name
      in: path
      required: true
      description: The skill's directory name — the string an agent step invokes it by.
      schema: { type: string }
    AgentKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: The agent's stable config key (e.g. `"ba"`), not its uuid.
      example: "ba"
    IssueId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
    GateId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LogOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0 }
      description: Byte offset into the raw log to resume from; omit (or 0) to fetch from the start.

  schemas:
    Budget:
      type: object
      properties:
        maxTokens:     { type: number }
        maxCostUsd:    { type: number }
        maxDurationMs: { type: number }
    Skill:
      type: object
      required: [name, path, agents, workflows, status]
      properties:
        name:      { type: string, description: "Directory name — what an agent step invokes." }
        path:      { type: [string, "null"], description: "Workspace-relative SKILL.md, null when only referenced." }
        bytes:     { type: [integer, "null"] }
        lines:     { type: [integer, "null"] }
        summary:   { type: [string, "null"], description: "Frontmatter description, else the first heading." }
        agents:    { type: array, items: { type: string }, description: "Agent keys that invoke it." }
        workflows: { type: array, items: { type: string } }
        status:    { type: string, enum: [ok, missing, unused] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
      example:
        error: "issue 'bad-id' not found"

    Agent:
      type: object
      required: [id, company_id, key, name, adapter, status, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        company_id:     { type: string, format: uuid }
        key:            { type: string }
        name:           { type: string }
        title:          { type: [string, "null"] }
        icon:           { type: [string, "null"] }
        reports_to:     { type: [string, "null"], format: uuid }
        adapter:        { type: string }
        model:          { type: [string, "null"] }
        effort:         { type: [string, "null"], enum: [low, medium, high, xhigh, max, null] }
        fallback_model: { type: array, items: { type: string } }
        cwd:            { type: [string, "null"] }
        mcp_enabled:    { type: boolean }
        extra_args:     { type: array, items: { type: string } }
        bundle_path:    { type: [string, "null"] }
        status:         { type: string, enum: [idle, running, disabled] }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
      example:
        id: "aaaaaaa1-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
        company_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
        key: "ba"
        name: "BA"
        title: "Business Analyst"
        icon: null
        reports_to: null
        adapter: "claude_local"
        model: "claude-sonnet-4-6"
        effort: "medium"
        fallback_model: []
        cwd: null
        mcp_enabled: true
        extra_args: []
        bundle_path: "agent-instructions/ba.json"
        status: "idle"
        created_at: "2026-08-17T09:00:00.000Z"
        updated_at: "2026-08-17T09:00:00.000Z"

    Issue:
      type: object
      required: [id, company_id, identifier, title, status, step_index, params]
      properties:
        id:                { type: string, format: uuid }
        company_id:        { type: string, format: uuid }
        identifier:        { type: string, example: "SCY-7" }
        parent_id:         { type: [string, "null"], format: uuid }
        title:             { type: string }
        description:       { type: [string, "null"] }
        status:            { type: string, enum: [todo, in_progress, in_review, blocked, done, cancelled] }
        assignee_agent_id: { type: [string, "null"], format: uuid }
        workflow_key:      { type: [string, "null"] }
        step_index:        { type: integer }
        params:            { type: object, additionalProperties: true }
      example:
        id: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
        company_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
        identifier: "SCY-7"
        parent_id: null
        title: "Requirements — RTWSA"
        description: null
        status: "in_review"
        assignee_agent_id: "aaaaaaa1-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
        workflow_key: "requirements"
        step_index: 3
        params: { project: "RTWSA", feature: "Appeals & Reviews" }

    Comment:
      type: object
      required: [id, issue_id, body, created_at]
      properties:
        id:              { type: string, format: uuid }
        issue_id:        { type: string, format: uuid }
        author_agent_id: { type: [string, "null"], format: uuid }
        author_user:     { type: [string, "null"] }
        body:            { type: string }
        created_at:      { type: string, format: date-time }
      example:
        id: "1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
        issue_id: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
        author_agent_id: null
        author_user: "tagari"
        body: "Approved: ship it."
        created_at: "2026-08-17T09:15:00.000Z"

    WorkProductContent:
      type: object
      description: >
        `content` is null whenever the file could not be read — the product is
        remote, resolves outside the workspace, or is missing — and `error`
        then says which. A missing file is reported this way rather than as a
        404 because the product exists and was attached, so its absence is a
        finding about the workspace rather than about the request.
      required: [id, title, url]
      properties:
        id:        { type: string, format: uuid }
        title:     { type: string, example: "capability-process.md" }
        url:       { type: string, format: uri }
        content:   { type: string, nullable: true }
        bytes:     { type: integer, description: "Size on disk, before any truncation." }
        truncated: { type: boolean, description: "True when the file exceeded 512 KB." }
        error:     { type: string, description: "Why there is no content." }

    WorkProduct:
      type: object
      required: [id, issue_id, type, provider, title, url, created_at]
      properties:
        id:         { type: string, format: uuid }
        issue_id:   { type: string, format: uuid }
        type:       { type: string, example: "document" }
        provider:   { type: string, enum: [local, confluence, jira] }
        title:      { type: string }
        url:        { type: string, format: uri }
        created_at: { type: string, format: date-time }
      example:
        id: "2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e"
        issue_id: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
        type: "document"
        provider: "local"
        title: "product-summary.md"
        url: "file:///workspace/projects/RTWSA/Appeals/outputs/product-summary.md"
        created_at: "2026-08-17T09:10:00.000Z"

    Gate:
      type: object
      required: [id, issue_id, kind, status, payload]
      properties:
        id:            { type: string, format: uuid }
        issue_id:      { type: string, format: uuid }
        kind:          { type: string, example: "approval" }
        status:        { type: string, enum: [pending, approved, rejected, cancelled] }
        payload:
          type: object
          required: [title]
          properties:
            title:     { type: string }
            summary:   { type: string }
            stepIndex: { type: integer }
        decision_note: { type: [string, "null"] }
        decided_by:    { type: [string, "null"] }
        decided_at:    { type: [string, "null"], format: date-time }
      example:
        id: "3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f"
        issue_id: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
        kind: "approval"
        status: "pending"
        payload: { title: "Approve Requirements", summary: "5 stories, 1 gap.", stepIndex: 3 }
        decision_note: null
        decided_by: null
        decided_at: null

    GateDecisionInput:
      type: object
      properties:
        note: { type: string, description: "Recorded as a comment on the issue when present." }
        by:   { type: string, description: "Who decided; defaults to \"orchestrator\"." }

    Run:
      type: object
      required: [id, issue_id, status, started_at, log_path]
      properties:
        id:                    { type: string, format: uuid }
        issue_id:              { type: string, format: uuid }
        agent_id:              { type: [string, "null"], format: uuid }
        step_index:            { type: [integer, "null"] }
        phase:                 { type: [string, "null"], example: "generate" }
        status:                { type: string, enum: [running, succeeded, failed, over_budget, orphaned] }
        started_at:            { type: string, format: date-time }
        finished_at:           { type: [string, "null"], format: date-time }
        exit_code:             { type: [integer, "null"] }
        log_path:              { type: string }
        session_id:            { type: [string, "null"] }
        input_tokens:          { type: [string, "null"], description: "bigint, returned as a string" }
        output_tokens:         { type: [string, "null"] }
        cache_read_tokens:     { type: [string, "null"] }
        cache_creation_tokens: { type: [string, "null"] }
        cost_usd:              { type: [string, "null"] }
        duration_ms:           { type: [string, "null"] }
        num_turns:             { type: [integer, "null"] }
      example:
        id: "4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f8a"
        issue_id: "8f14e2b1-9c3a-4e77-8b2d-1a2b3c4d5e6f"
        agent_id: "aaaaaaa1-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
        step_index: 1
        phase: "generate"
        status: "succeeded"
        started_at: "2026-08-17T09:05:00.000Z"
        finished_at: "2026-08-17T09:08:30.000Z"
        exit_code: 0
        log_path: ".orchestrator/runs/8f14e2b1-1.jsonl"
        session_id: "sess_abc123"
        input_tokens: "12500"
        output_tokens: "3400"
        cache_read_tokens: "8000"
        cache_creation_tokens: "500"
        cost_usd: "0.184200"
        duration_ms: "210000"
        num_turns: 14

    Usage:
      type: object
      description: >
        Reported and estimated spend are returned separately and must never be
        added together. `costUsd` is the sum of what each CLI reported for
        itself; `estCostUsd` is our own arithmetic, priced from token counts
        against the model catalogue, and is the only figure a Codex run has.
        `unpricedRunCount` counts runs carrying neither, because their model has
        no recorded price.
      required: [runCount, inputTokens, outputTokens, cacheReadTokens, cacheCreationTokens, costUsd, estCostUsd, unpricedRunCount]
      properties:
        runCount:            { type: integer }
        inputTokens:         { type: number }
        outputTokens:        { type: number }
        cacheReadTokens:     { type: number }
        cacheCreationTokens: { type: number }
        costUsd:             { type: number, description: "Reported by the CLI, verbatim." }
        estCostUsd:          { type: number, description: "Our estimate. Never merged into costUsd." }
        unpricedRunCount:    { type: integer, description: "Runs with neither figure." }

    TranscriptEvent:
      type: object
      required: [ts, kind]
      properties:
        ts:      { type: string, example: "14:32:01" }
        kind:    { type: string, enum: [assistant, tool_use, tool_result, skill, framing] }
        text:    { type: string }
        tool:    { type: string }
        preview: { type: string }
        name:    { type: string }

    Theme:
      type: object
      description: The 15-token palette `resolveTheme()` returns — see src/http/theme.ts.
      required: [brand, brandDeep, line, accent, ink50, ink100, ink200, ink500, glow, success, warning, danger, info, fontFamily, logoText]
      properties:
        brand:      { type: string, example: "#464E7E" }
        brandDeep:  { type: string, example: "#363C63" }
        line:       { type: string, example: "#E7E9F0" }
        accent:     { type: string, example: "#C8A878" }
        ink50:      { type: string, example: "#EEF0F7" }
        ink100:     { type: string, example: "#D9DDEB" }
        ink200:     { type: string, example: "#B6BDD6" }
        ink500:     { type: string, example: "#5C6593" }
        glow:       { type: string, example: "#7C82C8" }
        success:    { type: string, example: "#10B981" }
        warning:    { type: string, example: "#F59E0B" }
        danger:     { type: string, example: "#F43F5E" }
        info:       { type: string, example: "#3B82F6" }
        fontFamily: { type: string }
        logoText:   { type: string, example: "Scyne Orchestrator" }
