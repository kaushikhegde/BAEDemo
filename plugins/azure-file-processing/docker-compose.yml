name: azure-file-processing

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:76b8127d608fab8287a14a4bfeb9a5502cdcffb4bf1e86f09f324ebb0e70edba
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
              --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 2s
      timeout: 3s
      retries: 30

  orchestrator:
    build: .
    command: ["npx", "tsx", "src/orchestrator/server.ts"]
    environment:
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      ORCH_PORT: "8080"
      SAS_PUBLIC_BLOB_ENDPOINT: "http://127.0.0.1:10000/devstoreaccount1"
      # A container's filesystem is the image's, so every path a caller names
      # resolves to nothing (or, worse, to something unrelated that happens to
      # exist inside). The gate's own default cannot catch this — it keys off
      # MCP_BEARER_TOKEN, and a local Compose stack sets none — so this stack
      # says so explicitly and upload_file is not registered here at all.
      ALLOW_LOCAL_PATH_UPLOAD: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      azurite:
        condition: service_healthy

  worker:
    build: .
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    deploy:
      replicas: 2
    depends_on:
      azurite:
        condition: service_healthy

volumes:
  azurite-data:
